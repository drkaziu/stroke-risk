<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stroke Risk</title>
    <style>
        :root { --ink:#1A1A1A; --subtle:#6B7280; --accent:#E4572E; --muted:#C7CFD8; --grid:#EAECEF; }
        * { box-sizing: border-box; }
        body { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
               color: var(--ink); max-width: 560px; margin: 40px auto; padding: 0 20px; }
        h1 { font-size: 1.5rem; margin-bottom: 4px; }
        p.sub { color: var(--subtle); margin-top: 0; }
        form { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; margin-top: 24px; }
        label { display: flex; flex-direction: column; font-size: 0.85rem; color: var(--subtle); gap: 4px; }
        input, select { padding: 8px 10px; border: 1px solid var(--grid); border-radius: 8px;
                        font-size: 0.95rem; color: var(--ink); background: #fff; }
        button { grid-column: 1 / -1; padding: 12px; border: 0; border-radius: 8px;
                 background: var(--ink); color: #fff; font-size: 1rem; cursor: pointer; }
        button:hover { background: #000; }
        #result { grid-column: 1 / -1; margin-top: 6px; padding: 16px; border-radius: 10px;
                  background: #F7F8FA; display: none; }
        #result .prob { font-size: 1.6rem; font-weight: 700; }
        .note { color: var(--subtle); font-size: 0.8rem; grid-column: 1 / -1; }
    </style>
</head>
<body>
    <h1>Stroke Risk Estimator</h1>
    <p class="sub">Educational demo &mdash; not for real clinical use.</p>

    <form id="form">
        <label>Gender
            <select name="gender">
                <option>Male</option><option>Female</option><option>Other</option>
            </select>
        </label>
        <label>Age
            <input type="number" name="age" min="0" max="120" step="1" value="65" required>
        </label>
        <label>Hypertension
            <select name="hypertension"><option value="0">No</option><option value="1">Yes</option></select>
        </label>
        <label>Heart disease
            <select name="heart_disease"><option value="0">No</option><option value="1">Yes</option></select>
        </label>
        <label>Ever married
            <select name="ever_married"><option>Yes</option><option>No</option></select>
        </label>
        <label>Work type
            <select name="work_type">
                <option value="Private">Private</option>
                <option value="Self-employed">Self-employed</option>
                <option value="Govt_job">Government job</option>
                <option value="children">Child</option>
                <option value="Never_worked">Never worked</option>
            </select>
        </label>
        <label>Residence type
            <select name="Residence_type"><option>Urban</option><option>Rural</option></select>
        </label>
        <label>Avg. glucose level (mg/dL)
            <input type="number" name="avg_glucose_level" min="1" max="500" step="0.1" value="105" required>
        </label>
        <label>BMI (optional)
            <input type="number" name="bmi" min="1" max="100" step="0.1" value="28">
        </label>
        <label>Smoking status
            <select name="smoking_status">
                <option value="formerly smoked">Formerly smoked</option>
                <option value="never smoked">Never smoked</option>
                <option value="smokes">Smokes</option>
                <option value="Unknown">Unknown</option>
            </select>
        </label>

        <button type="submit">Estimate risk</button>
        <div id="result"></div>
        <span class="note">Model output is a probability; the highlighted decision uses a tuned threshold.</span>
    </form>

    <script>
        const form = document.getElementById('form');
        const result = document.getElementById('result');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = Object.fromEntries(new FormData(form).entries());

            const payload = {
                gender: data.gender,
                age: Number(data.age),
                hypertension: Number(data.hypertension),
                heart_disease: Number(data.heart_disease),
                ever_married: data.ever_married,
                work_type: data.work_type,
                Residence_type: data.Residence_type,
                avg_glucose_level: Number(data.avg_glucose_level),
                bmi: data.bmi === '' ? null : Number(data.bmi),
                smoking_status: data.smoking_status,
            };

            const resp = await fetch('/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
            });

            result.style.display = 'block';
            if (!resp.ok) {
                result.innerHTML = '<span class="prob">Invalid input</span>';
                return;
            }
            const out = await resp.json();
            const pct = (out.probability * 100).toFixed(1);
            const verdict = out.risk ? 'Elevated risk' : 'Lower risk';
            const color = out.risk ? 'var(--accent)' : 'var(--ink)';
            result.innerHTML =
                `<div class="prob" style="color:${color}">${pct}% &middot; ${verdict}</div>`;
        });
    </script>
</body>
</html>
