[project]
name = "stroke-risk"
version = "0.1.0"
description = "Leak-free stroke risk prediction: data pipeline, models, and deployment."
readme = "README.md"
authors = [
    { name = "Kazimieras Badokas", email = "badokas.ka@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "shap>=0.52.0",
    "uvicorn>=0.52.4",
    "xgboost>=3.4.1",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "nbstripout>=0.9.1",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Notebooks favour readable, exploratory code over strict library rules.
"notebooks/*" = ["E501", "E402", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
